# Set the two empty SECRET values in DigitalOcean before deploying.
# Never commit actual credentials to this file.
# This template mirrors the Safari-created trial; preserve live secrets on updates.
name: calendarhelperai
region: nyc
features:
    - buildpack-stack=ubuntu-22
services:
    - name: calendarhelperai
      github:
          repo: ericwastaken/CalendarHelperAi
          branch: codex/app-platform
          deploy_on_push: false
      source_dir: /
      environment_slug: python
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      http_port: 8080
      run_command: gunicorn --workers 1 --worker-class gthread --threads 2 --timeout 120 --worker-tmp-dir /dev/shm --bind 0.0.0.0:$PORT main:app
      # Omitted to retain the platform default used by the live trial.
      # An explicit HTTP health check can be introduced as a separate change.
      envs:
          - key: OPENAI_API_KEY
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: FLASK_SECRET_KEY
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: DEBUG_LOGGING
            scope: RUN_TIME
            value: "false"
          - key: DEBUG_LOG_IMAGE
            scope: RUN_TIME
            value: "false"
          - key: OPENAI_HTTP_CLIENT_LEVEL
            scope: RUN_TIME
            value: ERROR
          - key: OPENAI_API_LEVEL
            scope: RUN_TIME
            value: ERROR
ingress:
    rules:
        - component:
              name: calendarhelperai
          match:
              path:
                  prefix: /
