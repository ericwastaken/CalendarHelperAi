# Set empty runtime configuration and SECRET values before deploying.
# Never commit actual credentials to this file.
# Production deploys main. Preserve live secrets and custom domains on updates.
# This creation template does not include the live custom-domain bindings.
name: calendarhelperai
region: nyc
features:
    - buildpack-stack=ubuntu-22
services:
    - name: calendarhelperai
      github:
          repo: ericwastaken/CalendarHelperAi
          branch: main
          deploy_on_push: false
      source_dir: /
      dockerfile_path: Dockerfile
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      http_port: 8080
      # Use the image ENTRYPOINT: it supervises Gunicorn and Fluent Bit.
      # Do not override it with a Gunicorn-only run_command.
      health_check:
          http_path: /api/config
      envs:
          - key: LOG_ENV
            scope: RUN_TIME
            value: prod
          - key: LOG_OUTPUT
            scope: RUN_TIME
            value: s3
          - key: LOG_S3_BUCKET
            scope: RUN_TIME
            value: ""
          - key: LOG_S3_ENDPOINT
            scope: RUN_TIME
            value: ""
          - key: LOG_S3_REGION
            scope: RUN_TIME
            value: ""
          - key: LOG_S3_PREFIX
            scope: RUN_TIME
            value: calendarhelperai/prod
          - key: AWS_ACCESS_KEY_ID
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: AWS_SECRET_ACCESS_KEY
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: OPENAI_API_KEY
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: FLASK_SECRET_KEY
            scope: RUN_TIME
            type: SECRET
            value: ""
          - key: DEBUG_LOGGING
            scope: RUN_TIME
            value: "false"
          - key: DEBUG_LOG_IMAGE
            scope: RUN_TIME
            value: "false"
          - key: OPENAI_HTTP_CLIENT_LEVEL
            scope: RUN_TIME
            value: ERROR
          - key: OPENAI_API_LEVEL
            scope: RUN_TIME
            value: ERROR
ingress:
    rules:
        - component:
              name: calendarhelperai
          match:
              path:
                  prefix: /
