[project]
name = "calendar-helper-ai"
version = "1.0.0"
description = "Calendar Helper AI"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-login>=0.6.3",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "flask-wtf>=1.2.2",
    "routes>=2.5.1",
    "sqlalchemy>=2.0.37",
    "openai>=1.61.0",
    "icalendar>=6.1.1",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_helper_ai"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
