<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffefa">
    <meta name="description" content="Turn schedules, photos, and notes into calendar events. Review, refine, and download a calendar file.">
    <title>Calendar Helper AI</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
    <main class="app" aria-label="Calendar Helper AI">
        <header class="brandbar">
            <div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M8 3v4M16 3v4M8 14h3M13 14h3M8 17h3"/></svg></div>
            <div class="brand">Calendar Helper <em>AI</em></div>
            <button type="button" class="text-button" data-dialog="example">Example</button>
        </header>
        <ol class="progress" aria-label="Your progress">
            <li class="active" data-step="1" aria-current="step">1. Add details</li>
            <li data-step="2">2. Review</li>
            <li data-step="3">3. Export</li>
        </ol>
        <div class="content" id="screen"><p>Getting your calendar helper ready...</p></div>
        <noscript><p class="content">Please enable JavaScript to create and review calendar events.</p></noscript>
        <footer class="foot">
            <div class="foot-row">
                <span>Hosted on <a href="https://m.do.co/c/a45d31d9506d" target="_blank" rel="sponsored noopener noreferrer">DigitalOcean</a></span>
                <button type="button" class="text-button" data-dialog="terms">Terms of Service</button>
            </div>
            <p>By using this service, you accept our terms.</p>
            <p>Referral link: we may receive account credit.</p>
        </footer>
    </main>
    <p class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <dialog id="modal" aria-labelledby="modal-title">
        <button type="button" class="modal-close text-button" id="close-modal">Close</button>
        <div id="modal-content"></div>
    </dialog>
</body>
</html>
